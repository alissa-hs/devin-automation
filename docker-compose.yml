version: '3.8'

services:
  orchestrator:
    build: .
    environment:
      - DEVIN_API_KEY=${DEVIN_API_KEY}
      - GH_TOKEN=${GH_TOKEN}
      - ISSUE_NUMBER=${ISSUE_NUMBER}
      - ISSUE_TITLE=${ISSUE_TITLE}
      - ISSUE_BODY=${ISSUE_BODY}
      - ISSUE_URL=${ISSUE_URL}
      - REPO=${REPO}
    volumes:
      - ./observability:/app/observability